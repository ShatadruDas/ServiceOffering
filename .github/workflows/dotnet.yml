name: Build and test Service Offering

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  api:
    name: Build and test API
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore API solution
        run: dotnet restore Sd.ServiceOffering.Api/Sd.ServiceOffering.Api.slnx

      - name: Build API solution
        run: dotnet build Sd.ServiceOffering.Api/Sd.ServiceOffering.Api.slnx --configuration Release --no-restore

      - name: Test API solution
        run: dotnet test Sd.ServiceOffering.Api/Sd.ServiceOffering.Api.slnx --configuration Release --no-build --verbosity normal

  database:
    name: Build database project
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      # SQL projects require Visual Studio MSBuild and SSDT; dotnet build cannot build this project.
      - name: Build and validate database project
        run: msbuild Sd.ServiceOffering.Database/Sd.ServiceOffering.Database/Sd.ServiceOffering.Database.sqlproj /t:Build /p:Configuration=Release /p:Platform=AnyCPU /m
